manifestVersion: 1.1
id: epochbtc-satd
category: bitcoin
name: satd
version: "0.6.2"
tagline: A Bitcoin full node in Rust, with Electrum and Esplora built in
description: >-
  satd is a Bitcoin Core-compatible full node written in Rust. It speaks
  Core's JSON-RPC, config file and CLI, and serves an Electrum server and an
  Esplora REST API from the same process — no second indexer to run, no
  second copy of the chain to store.


  This app runs satd fully indexed, with TLS on every surface it exposes to
  your network. It generates a certificate authority for your install alone
  on first start; export it from the app's data directory, import it once,
  and Electrum wallets, REST clients and the MCP server are all trusted
  together.


  What it gives you:


  - Electrum server on TLS, for Sparrow, Electrum, BlueWallet and Zeus.

  - Esplora REST API on TLS, for anything that speaks Blockstream's API.

  - Bitcoin Core-compatible JSON-RPC, plain on the app network and TLS on
  your LAN.

  - An MCP server, so an AI assistant can query your own node instead of a
  public explorer.

  - `sat-cli` and `sat-tui`, a terminal dashboard for the node.


  This app contains satd and its own tools only. Lightning, BTCPay and
  wallets come from your app store as separate apps.


  Note on disk: satd here runs with the transaction and address indices on,
  because Electrum and Esplora both require them, and pruning is not
  compatible with that. Budget for the full chain plus roughly the same
  again in indices.
developer: 20 Gauge Software
website: https://github.com/epochbtc/satd
dependencies: []
repo: https://github.com/epochbtc/satd
support: https://github.com/epochbtc/satd/issues
# The host port app_proxy binds, in front of satd's status page. 8430, not
# the 3001 this used to be: Ride The Lightning owns 3001, and a manifest port
# shares one host port space with every port any app publishes. 8430–8439 is
# otherwise unused in the store; the published ports in exports.sh sit in the
# same block.
port: 8430
gallery: []
path: "/status"
# A community store may host its own icon; the official store hosts its own
# and wants this unset. Pinned to the release tag so a later change on master
# cannot alter an already-published listing.
icon: https://raw.githubusercontent.com/epochbtc/satd/v0.6.2/contrib/packaging/startos/icon.png
releaseNotes: >-
  Updates satd to 0.6.2, a security release. satd now refuses TLS
  certificates that chain through the eMudhra (emSign) intermediate
  certificate authorities, whose private keys were disclosed on 2026-10-20.
  Before this, anyone holding those keys could impersonate a webhook
  receiver or a remote node to satd's TLS clients.


  No rebuild is needed when updating from 0.6.0 or 0.6.1. Updating straight
  from 0.5.2 rebuilds the chainstate once on the first start, from the block
  files already on disk; the status page shows its progress.


  Updating from 0.6.0 also brings the 0.6.1 fixes. Since 0.6.1, Electrum and
  Esplora requests time out after 30 seconds. A wallet that reads a very long
  address history may need `electrumrequesttimeout` raised in the app's
  bitcoin.conf.


  Full notes:
  https://github.com/epochbtc/satd/blob/v0.6.2/docs/release-notes/0.6.2.md
  and, for 0.6.1,
  https://github.com/epochbtc/satd/blob/v0.6.2/docs/release-notes/0.6.1.md
# Regenerable, and hundreds of gigabytes. What stays in the backup is what
# cannot be re-derived: tls/ (the CA clients have imported), secrets/ (the MCP
# token), authfile.toml and bitcoin.conf. `data/` is the directory mounted at
# /var/lib/satd. Mainnet lives at its root; every other network is a
# subdirectory with the same layout, which the `*` entries cover.
backupIgnore:
  - data/blocks
  - data/chainstate
  - data/chainstate_background
  - data/mempool.dat
  - data/.cookie
  - data/*/blocks
  - data/*/chainstate
  - data/*/chainstate_background
  - data/*/mempool.dat
  - data/*/.cookie
submitter: 20 Gauge Software
submission: https://github.com/epochbtc/satd
