# Inert inside the satd repository: GitHub only runs workflows from the
# repository root. contrib/packaging/sync-store.sh copies this directory to the
# root of the package repository, where these four files are the CI Start9's
# community registry expects, modelled on its accepted packages.
name: Build

on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ['*.md']
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.draft == false
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@master
    # No DEV_KEY: a PR build publishes nothing, so it needs no signing key.
