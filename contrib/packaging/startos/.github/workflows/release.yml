# See build.yml for where this file runs.
name: Release

on:
  push:
    tags:
      - 'v*.*'

jobs:
  release:
    # Publishing needs Start9's signing key and registry credentials, which
    # exist only in the Start9-Community fork. Anywhere else this job would
    # fail on the missing secret rather than do anything.
    if: github.repository_owner == 'Start9-Community'
    uses: Start9Labs/start-technologies/.github/workflows/release.yml@master
    with:
      RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
      S3_S9PKS_BASE_URL: ${{ vars.S3_S9PKS_BASE_URL }}
    secrets:
      DEV_KEY: ${{ secrets.DEV_KEY }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
    permissions:
      contents: write
