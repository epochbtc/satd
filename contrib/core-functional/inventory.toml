# Bitcoin Core functional-test inventory.
#
# One row per test file in the pinned Core release. Generated once from a
# measured full-suite run; maintained by hand from then on.
#
# A row flips to `status = "run"` only in the pull request that makes it pass.
# `check_inventory.py` enforces the schema; see README.md for the rules.

