# satd push relay — example configuration.
#
# Point a satd alertfile hook at this relay:
#
#   [[webhook]]
#   id = "push"
#   url = "http://127.0.0.1:9099/hook"
#   secret = "the same value as satd_secret below"
#   categories = ["status", "chain"]
#   min_severity = "warning"

listen = "127.0.0.1:9099"

# Must match the hook's `secret` in satd's alertfile. Every request is verified
# against it before the body is parsed.
satd_secret = "replace-me-with-a-long-random-string"

# Drop anything quieter than this. `warning` is the usual choice: a push
# notification for "IBD finished" is noise.
min_severity = "warning"

# --- Apple Push Notification service (token auth) ---------------------------
# [apns]
# key_file = "/etc/satd-push-relay/AuthKey_ABC1234567.p8"
# key_id = "ABC1234567"
# team_id = "TEAM123456"
# topic = "com.example.yourapp"
# production = false            # false = sandbox gateway
# device_tokens = ["<64-hex device token>"]

# --- Firebase Cloud Messaging (HTTP v1) -------------------------------------
# [fcm]
# service_account_file = "/etc/satd-push-relay/service-account.json"
# device_tokens = ["<registration token>"]
