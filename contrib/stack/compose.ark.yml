# Ark overlay — an Ark server (arkd) backed by satd. EXPERIMENTAL.
#
#   docker compose -f compose.yml -f compose.ark.yml up -d
#   docker compose -f compose.yml -f compose.ark.yml run --rm ark-init
#
# BEST-EFFORT, and more experimental than the other overlays: Ark is young,
# arkd's configuration surface is not documented in a form worth pinning,
# and every setting here was established by running the binary rather than
# by reading a specification. Expect it to need attention on a version bump.
#
# ## How it reaches satd
#
#   satd  ->  NBXplorer  ->  arkd-wallet  ->  arkd
#
# arkd v0.9 splits the wallet into its own service, and that wallet's chain
# backend is NBXplorer — not Esplora, and not Bitcoin Core's ZMQ. That
# matters here for two reasons. satd implements no raw ZMQ topics, so a
# backend that needed them would rule Ark out entirely; and NBXplorer
# against satd is already a PR-gating canary in this repository, so the one
# link in this chain that touches satd is the link that is continuously
# tested.
#
# Postgres is NBXplorer's, not Ark's. If you are already running
# compose.btcpay.yml you have NBXplorer and Postgres; run one or the other,
# not both, or give this overlay its own project.
#
# ## First run
#
# arkd refuses to start without a signer key, and its wallet must be created
# and unlocked before the service answers. `ark-init` does both, once:
#
#   docker compose -f compose.yml -f compose.ark.yml run --rm ark-init
#
# It writes the generated signer key and wallet password into the ark-data
# volume. They are generated per install, never shipped.

services:
  ark-db:
    image: postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
    environment:
      POSTGRES_PASSWORD: ${ARK_POSTGRES_PASSWORD:?generate one with `openssl rand -hex 24` and put ARK_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nbxplorer
    volumes:
      - ark-db:/var/lib/postgresql/data
    networks: [satd]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  ark-nbxplorer:
    image: nicolasdorier/nbxplorer:2.5.21@sha256:0eaa2b165873face1ac699297b45f5110d57b557558d68588896dc386c7eb3cb
    depends_on:
      ark-db:
        condition: service_healthy
    environment:
      NBXPLORER_NETWORK: ${NETWORK:-signet}
      NBXPLORER_BIND: 0.0.0.0:32838
      NBXPLORER_CHAINS: btc
      NBXPLORER_BTCRPCURL: http://${SATD_HOST:-satd}:8332
      NBXPLORER_BTCRPCCOOKIEFILE: /satd/rpc-cookie
      NBXPLORER_BTCNODEENDPOINT: ${SATD_HOST:-satd}:${SATD_P2P_PORT:-38333}
      NBXPLORER_POSTGRES: Host=ark-db;Port=5432;Database=nbxplorer;Username=postgres;Password=${ARK_POSTGRES_PASSWORD}
      NBXPLORER_NOAUTH: "1"
      # Without this, NBXplorer decides a short regtest chain needs warming
      # up and calls a mining RPC satd does not implement, which kills its
      # indexer loop before it ever connects. The repository's NBXplorer
      # canary sets the same flag.
      NBXPLORER_NOWARMUP: "1"
    volumes:
      - satd-data:/satd:ro
      - ark-nbxplorer:/datadir
    networks: [satd]
    restart: unless-stopped
    expose: ["32838"]

  arkd-wallet:
    image: ghcr.io/arkade-os/arkd-wallet:v0.9.16@sha256:9c4092115440039e87f1fc7e053c388d508abb36edbe9fe07c9e0a140948edd2
    depends_on: [ark-nbxplorer]
    environment:
      ARKD_WALLET_NBXPLORER_URL: http://ark-nbxplorer:32838
      ARKD_WALLET_NETWORK: ${NETWORK:-signet}
      ARKD_WALLET_DATADIR: /app/data
      # Generated by ark-init into the shared volume on first run.
      ARKD_WALLET_SIGNER_KEY: ${ARKD_SIGNER_KEY:-}
    volumes:
      - ark-data:/app/data
    networks: [satd]
    restart: unless-stopped
    expose: ["6060"]
    healthcheck:
      # arkd exits rather than waits when the wallet is not yet serving, and
      # the wallet itself waits on NBXplorer, which waits on satd. That is a
      # long readiness chain with nothing gating it, so it gets a gate.
      # /bin/sh in this image has no /dev/tcp, hence the wget probe: any
      # answer on 6060 means the gRPC listener is bound.
      test: ["CMD-SHELL", "wget -q -T 2 -O - http://127.0.0.1:6060 2>&1 | grep -q . || nc -z 127.0.0.1 6060"]
      interval: 10s
      timeout: 5s
      start_period: 3m
      retries: 12

  arkd:
    image: ghcr.io/arkade-os/arkd:v0.9.16@sha256:f723e26a1bff7fa529dc0abd414088f294e43be8916dbb8f081dccd6fcad90b5
    depends_on:
      arkd-wallet:
        condition: service_healthy
    entrypoint: ["/app/arkd", "start"]
    environment:
      ARKD_WALLET_ADDR: arkd-wallet:6060
      ARKD_NETWORK: ${NETWORK:-signet}
      ARKD_DATADIR: /app/data
      ARKD_PORT: "7070"
      ARKD_EVENT_DB_TYPE: badger
      ARKD_DB_TYPE: badger
      ARKD_LIVE_STORE_TYPE: inmemory
      # Plain HTTP on the container network; the proxy overlay terminates
      # TLS for anything that leaves the host, as it does for every other
      # web surface here.
      ARKD_NO_TLS: "true"
    volumes:
      - arkd-data:/app/data
    networks: [satd]
    restart: unless-stopped
    expose: ["7070", "7071"]

  # One-shot, run explicitly: `docker compose ... run --rm ark-init`.
  ark-init:
    image: ghcr.io/arkade-os/arkd:v0.9.16@sha256:f723e26a1bff7fa529dc0abd414088f294e43be8916dbb8f081dccd6fcad90b5
    entrypoint: ["/bin/sh", "/ark-init"]
    volumes:
      - ./ark/ark-init:/ark-init:ro
      - ark-data:/app/data
    networks: [satd]
    profiles: ["init"]
    restart: "no"

volumes:
  ark-db:
  ark-nbxplorer:
  ark-data:
  arkd-data:
