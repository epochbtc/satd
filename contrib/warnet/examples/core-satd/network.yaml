# A ring that alternates Bitcoin Core and satd, so every block and transaction
# crosses between the two implementations. tank-0000 (Core) is a good miner.
nodes:
  - name: tank-0000
    addnode:
      - tank-0001
  - name: tank-0001
    image:
      repository: satd-warnet
      tag: "0.5.2-warnet0"
      pullPolicy: Never
    addnode:
      - tank-0002
  - name: tank-0002
    addnode:
      - tank-0003
  - name: tank-0003
    image:
      repository: satd-warnet
      tag: "0.5.2-warnet0"
      pullPolicy: Never
    addnode:
      - tank-0000
