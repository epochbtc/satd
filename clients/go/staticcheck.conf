# Staticcheck runs the SA (correctness/bug) and U (unused) classes only.
#
# The style (ST) and simplification (S) classes are deliberately off: this gate
# exists to catch defects - deprecated gRPC APIs (SA1019), t.Fatal from a
# non-test goroutine (SA2002), concurrency misuse, dead unexported code in a
# published library (U1000) - not to argue about phrasing. gofmt and go vet
# cover the rest. Generated files (the committed protobuf bindings) are skipped
# by staticcheck's own "Code generated ... DO NOT EDIT." detection.
checks = ["SA*", "U*"]
