name: Core functional tests

# Runs Bitcoin Core's own functional test suite, unmodified, against satd.
# See contrib/core-functional/README.md for what the harness may and may not do
# to make a test pass.
#
# The PR gate lives in canary.yml's `core-functional` job, which reuses the
# release build already shared with the canary fleet. This workflow keeps the
# *nightly* run, which pays for its own build and is where the run set gets
# widened and a candidate measurement runs unattended.
#
# Every job here runs on GitHub-hosted runners. satd is public.
#
# A flake in the gated run set gets its downstream pinned or a
# `flaky-quarantine` row with an issue behind it -- never a weakened gate.

on:
  schedule:
    # Nightly, offset off the hour to avoid the top-of-hour scheduling crowd.
    - cron: "37 4 * * *"
  workflow_dispatch:
  pull_request:
    # Only the cheap `inventory` job runs on PRs; the PR gate that actually
    # runs the suite is canary.yml's `core-functional`, which shares the
    # fleet's build instead of paying for its own.
    types: [opened, synchronize, reopened]

concurrency:
  group: core-functional-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # Cheap, no build: the inventory must describe exactly the pinned test list.
  # Runs on every PR so a stale or malformed inventory is caught immediately.
  inventory:
    name: "Inventory"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Validate inventory against the pinned test list
        run: contrib/core-functional/check_inventory.py

      - name: Harness self-tests
        run: |
          contrib/core-functional/tests/test_check_inventory.sh
          contrib/core-functional/tests/test_check_results.sh

      - name: Named-parameter table matches the pinned Core
        run: |
          # A renamed Core argument costs compatibility; a *reordered* one
          # binds values to the wrong positions and nothing else would notice.
          contrib/core-functional/fetch-core.sh
          contrib/core-functional/gen-named-params.py --check --cross-check \
            contrib/core-functional/core

      - name: Scoreboard
        run: contrib/core-functional/check_inventory.py --summary >> "$GITHUB_STEP_SUMMARY"

  # Is the pin still the newest final Core release? Informational -- a new Core
  # release should not turn the tree red, it should open a bump PR's worth of
  # work. Never counts an -rc as newer.
  pin-freshness:
    name: "Pin freshness"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Compare PIN against Core's newest final release
        run: |
          set -euo pipefail
          . contrib/core-functional/PIN
          latest=$(git ls-remote --tags --refs https://github.com/bitcoin/bitcoin \
                     | sed 's|.*refs/tags/||' \
                     | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' \
                     | sort -V | tail -1)
          echo "pinned: $CORE_TAG   newest final: $latest"
          if [ "$CORE_TAG" != "$latest" ]; then
            echo "::notice::Core $latest is out; pinned at $CORE_TAG. See contrib/core-functional/README.md for the bump procedure."
          fi

  run:
    name: "Run"
    # GitHub-hosted, like every other job in this public repository. This job
    # builds and executes the checked-out tree -- `cargo build` alone runs
    # every dependency's build.rs, and the harness then runs run.sh, the shims
    # and Core's python. On a maintainer-owned machine that is arbitrary code
    # execution with that host's filesystem and credentials; on a hosted
    # runner it is a disposable VM. See ci.yml's header: satd moved its
    # PR-triggered jobs off self-hosted for this reason in #149, and this job
    # was the last one that had not followed.
    #
    # The suite itself is under a minute; the release build is the cost, and
    # nightly is where it can be afforded without a shared artifact.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: inventory
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    env:
      # Keep datadirs inside the workspace so the cleanup step below can
      # remove them even when a test fails or the job times out.
      SATD_CF_TMPDIR: ${{ github.workspace }}/.core-functional-tmp
      SATD_CF_JOBS: 4
      RUST_TOOLCHAIN: '1.93.0'
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        # Hosted ubuntu-24.04 ships ~30 GB of pre-installed SDKs we don't
        # use. Reclaim before the release build mid-links.
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install Linux build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master as of 2026-08-05
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo registry + git
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-corefunc-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-corefunc-cargo-

      - name: Cache target directory
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-corefunc-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-corefunc-target-

      - name: Build satd and sat-cli
        run: cargo build --release --locked --bin satd --bin sat-cli

      - name: Fetch the pinned Core tree
        run: contrib/core-functional/fetch-core.sh

      - name: Preflight
        run: contrib/core-functional/run.sh --dry-run

      - name: Run the inventory's run-set
        run: contrib/core-functional/run.sh

      - name: Scoreboard
        if: always()
        run: contrib/core-functional/check_inventory.py --summary >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up test datadirs
        if: always()
        # Core's runner keeps a failing test's datadir for debugging; on a
        # persistent runner those accumulate a full node's block files and
        # RocksDB per failed test, every night, forever. The failure output
        # is already in the job log.
        run: rm -rf "$SATD_CF_TMPDIR"
