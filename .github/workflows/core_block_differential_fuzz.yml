# Block-acceptance differential fuzz — in-process consensus fuzzer with a live
# Bitcoin Core oracle (fuzz/fuzz_targets/block_differential.rs). libFuzzer mutates blocks,
# satd validates them in-process (coverage-guided, catches panics), and a
# resident bitcoind is the accept/reject oracle.
#
# NOT a PR gate. It is long-running and needs a nightly toolchain + cargo-fuzz
# + Docker, so it runs on a nightly schedule and on demand. A discovered
# divergence fails the job; the offending block is in the run log (printed to
# stderr) and uploaded as an artifact.
#
# Triage: a divergence is a real consensus difference between satd and Core —
# investigate before dismissing. Infra flakes (image pull 5xx, runner OOM):
# rerun. Never weaken the accept/reject assertion in response to a flake.
#
# A failure notifies via a GitHub issue in two of three cases — a divergence
# (`fuzz-divergence`) and a broken job (`fuzz-broken`, covering both a failing
# fuzz step and a 3+ run red streak). A lone pre-fuzz infra flake stays quiet.
# See the "Triage failure and notify" step for the full classification.

name: Bitcoin Core block-acceptance fuzz

on:
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Fuzz duration in seconds"
        required: false
        default: "1800"
  schedule:
    # Nightly 04:00 UTC.
    - cron: '0 4 * * *'

permissions:
  contents: read
  # Allow the failure step to open / comment on a tracking issue.
  issues: write
  # Read this workflow's own run history. The streak check below is the
  # catch-all for a misclassified failure, and without this it 403s — which,
  # defaulted to zero, looks exactly like "no streak" and files nothing.
  actions: read

concurrency:
  group: core-block-differential-fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  # cargo-fuzz needs a nightly toolchain, but this job is here to find
  # consensus divergence, not to track rustc. A floating `nightly` makes any
  # upstream regression red the job: nightly-2026-07-24 (rustc 89c61a754) ICEs
  # in rustc_codegen_ssa building `tokio` in release mode, which broke every
  # run until this pin. Bump deliberately after checking the new toolchain
  # builds `scripts/fuzz/run-block-differential.sh` locally; keep in sync with
  # the default in that script.
  FUZZ_NIGHTLY: nightly-2026-07-22
  # cargo-fuzz's own version, pinned for the same reason the toolchain is.
  # `--locked` pins cargo-fuzz's *dependencies*, not cargo-fuzz itself, so an
  # unpinned install silently tracks upstream — and when it raises its MSRV past
  # FUZZ_NIGHTLY the install fails *before* the fuzz step, producing a red job
  # with no reproducer. That lands in the infra bucket, which files nothing, so
  # the pipeline goes quietly dark until the streak catch-all notices two nights
  # later. Bump alongside FUZZ_NIGHTLY.
  CARGO_FUZZ_VERSION: '0.13.2'

jobs:
  block-differential:
    name: block-differential fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install Linux build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev libssl-dev pkg-config

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.FUZZ_NIGHTLY }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version ${{ env.CARGO_FUZZ_VERSION }}

      - name: Pre-pull Bitcoin Core image
        run: |
          set -euo pipefail
          for i in 1 2 3; do docker pull lncm/bitcoind:v27.0 && break || sleep $((i * 2)); done

      - name: Run block-differential fuzz
        id: fuzz
        env:
          MAX_TOTAL_TIME: ${{ github.event.inputs.max_total_time || '1800' }}
          FUZZ_NIGHTLY: ${{ env.FUZZ_NIGHTLY }}
        run: bash scripts/fuzz/run-block-differential.sh

      - name: Upload divergence artifacts
        # `cancelled()` as well as `failure()`: GitHub *cancels* rather than
        # fails a job that hits `timeout-minutes`, and the fuzz step is the one
        # that would be running when it does. Without this, a hang past the
        # deadline discards the reproducer that proves it.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: core-block-differential-fuzz-artifacts
          path: fuzz/artifacts/**
          if-no-files-found: ignore
          retention-days: 30

      # Failure triage. Three classes, distinguished by whether a reproducer
      # exists and whether the fuzz step itself is what failed:
      #
      #   (a) DIVERGENCE / crash / hang — libFuzzer wrote a reproducer under
      #       fuzz/artifacts/. A real consensus finding. -> `fuzz-divergence`.
      #
      #   (b) BROKEN JOB — the fuzz step failed but produced no reproducer,
      #       i.e. the target or its build is broken (compile error, a stale
      #       `ConnectParams`, a toolchain ICE). Persistent and actionable,
      #       yet it yields no reproducer — so the previous version of this
      #       step classified it as "infra/flake" and filed nothing. That is
      #       exactly how this workflow stayed red for 41 consecutive runs
      #       (2026-06-14 -> 2026-07-24) with nobody notified. -> `fuzz-broken`.
      #
      #   (c) INFRA — an earlier step failed (apt, `cargo install`, image-pull
      #       5xx, runner OOM), so the fuzz step never ran. Usually transient:
      #       rerun, no issue. But a streak of >=3 consecutive scheduled
      #       failures is itself a signal that nobody is watching, so that
      #       escalates to `fuzz-broken` rather than staying silent.
      #
      # CANCELLATION is handled too, because GitHub *cancels* rather than fails
      # a job that exceeds `timeout-minutes`, and `failure()` is false for a
      # cancelled job. This job has no dependency cache, so a cold run builds
      # cargo-fuzz, then node+rocksdb+bitcoinconsensus for gen_corpus, then the
      # whole tree again under ASan, before fuzzing for 30 minutes — the 60
      # minute ceiling is not far away. `cancel-in-progress` can cancel it too
      # (a workflow_dispatch on master supersedes the running nightly). A
      # cancelled run's conclusion is not `failure` either, so the (c) streak
      # counter never counted it: the job could time out every single night and
      # notify nothing, forever. A cancellation that reached the fuzz step is
      # reported as (b) if it left a reproducer (a genuine hang) and otherwise
      # as a timeout; one that did not reach it is left alone, since that is a
      # deliberate supersede.
      #
      # Manual workflow_dispatch runs never notify — whoever dispatched is
      # watching. Never weaken the accept/reject assertion for any of these.
      - name: Triage failure and notify
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          # '' / 'skipped' when an earlier step failed; 'failure' when the
          # fuzz step itself is what broke; 'cancelled' when the job hit
          # `timeout-minutes` or was superseded mid-fuzz. This is the (b)-vs-(c)
          # test.
          FUZZ_OUTCOME: ${{ steps.fuzz.outcome }}
          JOB_CANCELLED: ${{ cancelled() }}
        run: |
          set -euo pipefail

          today=$(date -u +%F)

          # One open issue per label: comment on it if present, else open it.
          # Keeps a recurring condition to a single thread instead of a new
          # issue per night.
          notify() {
            label="$1"; color="$2"; label_desc="$3"; title="$4"; body="$5"; comment="$6"
            gh label create "$label" --color "$color" --description "$label_desc" \
              2>/dev/null || true
            existing=$(gh issue list --label "$label" --state open \
              --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              echo "Commenting on existing issue #$existing ($label)"
              gh issue comment "$existing" --body "$comment"
            else
              echo "Opening new $label issue"
              gh issue create --label "$label" --title "$title" --body "$body"
            fi
          }

          repros=$(find fuzz/artifacts -type f 2>/dev/null | sort || true)

          # ---- (a) real divergence -------------------------------------
          if [ -n "$repros" ]; then
            echo "Reproducer(s) found — filing/updating a divergence issue:"
            echo "$repros"
            repro_list=$(echo "$repros" | sed 's/^/- `/; s/$/`/')

            body=$(cat <<EOF
          The **block-differential fuzzer** found a \`satd\` ↔ Bitcoin Core
          accept/reject divergence (or a hang/OOM) on a specific block.

          - Run: $RUN_URL
          - Commit: \`$COMMIT_SHA\`
          - Reproducer(s) (also in the \`core-block-differential-fuzz-artifacts\` artifact):

          $repro_list

          The offending block hex is also printed to stderr in the run log.
          This is a confirmed finding, not a flake — investigate before
          closing, and never weaken the accept/reject assertion to make it
          pass. Close this issue once resolved; the next divergence opens a
          fresh one.
          EOF
            )
            notify fuzz-divergence B60205 \
              "block-differential fuzz found a satd/Core divergence" \
              "Fuzz divergence: satd vs Bitcoin Core ($today)" \
              "$body" \
              "Another divergence on $today: $RUN_URL"
            exit 0
          fi

          # ---- (b) the fuzz step itself failed, no reproducer ----------
          if [ "$FUZZ_OUTCOME" = "failure" ]; then
            echo "Fuzz step failed with no reproducer — the job itself is broken."

            body=$(cat <<EOF
          The **block-differential fuzz job is broken**: the fuzz step failed
          without producing a reproducer, so this is *not* a consensus
          divergence — the target or its build is not working.

          - Run: $RUN_URL
          - Commit: \`$COMMIT_SHA\`

          Usual causes, in rough order of likelihood:

          - \`node\` no longer compiles with \`default-features = false\`
            (\`fuzz/\` is the only in-tree consumer of a consensus-only
            \`node\`; PR CI's \`--all-features\` clippy cannot catch this,
            which is why the Lint job has a dedicated consensus-only step).
          - The fuzz target drifted from a \`node\` API it constructs by hand
            — e.g. a new \`ConnectParams\` field.
          - The pinned nightly (\`FUZZ_NIGHTLY\`) broke, or an upstream rustc
            ICE. Verify locally before bumping the pin.

          Reproduce locally (needs Docker + a nightly toolchain):

          \`\`\`
          MAX_TOTAL_TIME=120 bash scripts/fuzz/run-block-differential.sh
          \`\`\`

          This job finds consensus divergence, so while it is broken that
          coverage is simply absent — treat it as urgent, not cosmetic. Close
          once it is green again.
          EOF
            )
            notify fuzz-broken D93F0B \
              "block-differential fuzz job is broken (not a divergence)" \
              "Fuzz job broken: block-differential target fails to run ($today)" \
              "$body" \
              "Still broken as of $today: $RUN_URL"
            exit 0
          fi

          # ---- (b') cancelled mid-fuzz: a timeout, reported as broken ---
          # A job that exceeds `timeout-minutes` is CANCELLED, not failed, so
          # `$FUZZ_OUTCOME` is `cancelled` and neither branch above fires. It
          # also never reaches the (c) streak counter, whose `gh run list`
          # filter matches `conclusion == "failure"`. Left alone, the job could
          # time out every night forever and notify nothing.
          #
          # Only a cancellation that reached the fuzz step is reported. One that
          # did not is a deliberate supersede (`cancel-in-progress` when someone
          # dispatches a manual run over the nightly), and paging for that would
          # be noise.
          if [ "$FUZZ_OUTCOME" = "cancelled" ] || \
             { [ "$JOB_CANCELLED" = "true" ] && [ "$FUZZ_OUTCOME" = "failure" ]; }; then
            echo "Job was cancelled with the fuzz step running — treating as a timeout."

            body=$(cat <<EOF
          The **block-differential fuzz job was cancelled while fuzzing**,
          which in practice means it hit its \`timeout-minutes\` ceiling. This
          is not a consensus divergence and not a transient infra blip: the run
          produced no verdict at all, and it will keep producing none.

          - Run: $RUN_URL
          - Commit: \`$COMMIT_SHA\`

          The job has no dependency cache, so every run cold-builds
          \`cargo-fuzz\`, then \`node\` + rocksdb + bitcoinconsensus for
          \`gen_corpus\`, then the whole tree again under ASan, and only then
          fuzzes for \`MAX_TOTAL_TIME\` (default 1800s). The 60-minute ceiling
          leaves little headroom, so this trips when the runner is slow or a
          dependency graph grows.

          Options, roughly in order of preference:

          - Cache the build (\`Swatinem/rust-cache\`, keyed separately from the
            PR-CI legs since this uses a nightly toolchain).
          - Lower \`MAX_TOTAL_TIME\` so build time and fuzz time fit.
          - Raise \`timeout-minutes\`.

          Note that a cancelled run is invisible to this workflow's own
          consecutive-failure counter, which matches on \`failure\` — so
          nothing else will report this.
          EOF
            )
            notify fuzz-broken D93F0B \
              "block-differential fuzz job is broken (not a divergence)" \
              "Fuzz job broken: block-differential run timed out ($today)" \
              "$body" \
              "Timed out again on $today: $RUN_URL"
            exit 0
          fi

          # ---- (c) infra failure: escalate only on a streak ------------
          # Exclude the current (still in-progress) run via --status completed,
          # so two prior failures + this one == three consecutive.
          # Escalate rather than default to zero if the query itself fails.
          # `2>/dev/null || echo 0` made a 403, a rate limit, or a stale
          # `--workflow` filename after a rename indistinguishable from a
          # healthy no-streak run: the step logged "not both red (0/2)" and
          # filed nothing, silently voiding the one guarantee this branch
          # exists to provide.
          if ! prior_failures=$(gh run list \
            --workflow core_block_differential_fuzz.yml \
            --event schedule --status completed --limit 2 \
            --json conclusion \
            --jq '[.[] | select(.conclusion == "failure")] | length'); then
            echo "Could not read prior run conclusions; assuming a streak so this cannot pass unnoticed."
            prior_failures=2
          fi

          if [ "${prior_failures:-0}" -lt 2 ]; then
            echo "Infra failure before the fuzz step ran, and the preceding"
            echo "scheduled runs were not both red ($prior_failures/2). Treating"
            echo "as a transient flake: rerun the job. Not filing an issue."
            exit 0
          fi

          echo "Infra failure, but the last 3 scheduled runs are all red —"
          echo "escalating: a persistently red pipeline is not a flake."

          body=$(cat <<EOF
          The **block-differential fuzz job has failed 3+ consecutive scheduled
          runs**, each time before the fuzz step could run (apt, \`cargo
          install\`, image pull, or runner resources).

          - Latest run: $RUN_URL
          - Commit: \`$COMMIT_SHA\`

          Any single one of these is a flake worth a rerun; three in a row is
          an outage. Something in the job's environment needs fixing —
          otherwise the consensus-divergence coverage this job provides stays
          silently absent. Close once a scheduled run goes green.
          EOF
          )
          notify fuzz-broken D93F0B \
            "block-differential fuzz job is broken (not a divergence)" \
            "Fuzz job broken: 3+ consecutive scheduled failures ($today)" \
            "$body" \
            "Still failing before the fuzz step as of $today: $RUN_URL"
