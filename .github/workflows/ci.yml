name: CI

# PR-triggered build + test + lint. Runs on GitHub-hosted runners so that
# untrusted fork PRs cannot execute arbitrary code on a maintainer-owned
# self-hosted machine. Tag-cut release builds live in `release.yml` (also
# hosted); reproducible-build verification lives in `nix.yml`.

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel superseded runs on the same PR. Avoids burning hosted-runner
# minutes on stale commits when a contributor pushes rapid fixups.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  test:
    name: "Tests"
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      # Hosted ubuntu-24.04 ships ~30 GB of pre-installed SDKs we don't
      # use (Android, .NET, Haskell, CodeQL). The workspace target/
      # directory plus cargo registry routinely exceed the remaining
      # ~14 GB of free disk and SIGBUS the linker mid-link of debug-mode
      # test binaries. Reclaim ~20 GB before the build.
      - name: Free disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/PyPy
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      # rocksdb-sys needs libclang (bindgen headers) and the rocksdb
      # native build wants cmake. Hosted ubuntu-24.04 ships clang +
      # cmake binaries but NOT libclang-dev — install explicitly.
      # libssl-dev is needed by the openssl-sys path in reqwest's
      # native-tls backend.
      - name: Install Linux build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            libclang-dev \
            libssl-dev \
            pkg-config

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93
          components: clippy
          override: true

      # Caches ~/.cargo/{registry,git,bin} AND target/, pruning the
      # fast-changing first-party crate artifacts so the expensive dependency
      # builds (rocksdb-sys + its C++ tree, bindgen, proc-macros) are restored
      # instead of recompiled every run. Keyed automatically on the rustc
      # version + Cargo.lock. Replaces the old registry-only actions/cache@v3,
      # which left target/ uncached — so every run rebuilt rocksdb from scratch
      # (~8 min of an ~9 min job). cache-on-failure keeps the warm cache even
      # when tests fail, so iterating on a red PR doesn't pay the full rebuild
      # each push. SHA-pinned (v2.9.1) for supply-chain hygiene.
      - name: Cache Rust dependencies & target dir
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          # Match the `seed-cache` job's `tests` key so a fresh branch's first
          # run restores master's seeded dependency cache (key = shared-key +
          # rustc + Cargo.lock hash, independent of job/event), not a cold one.
          shared-key: tests

      # Pre-build sat-cli. The satd integration tests reach `sat-cli` by
      # path lookup (`Path::new(CARGO_BIN_EXE_satd).parent().join("sat-cli")`)
      # rather than via the `CARGO_BIN_EXE_*` mechanism, because the
      # binary lives in a sibling crate. `cargo test` only auto-builds
      # bin targets for the same crate as the test, so without this
      # explicit step the path lookup finds nothing and every sat-cli
      # test fails with ENOENT. The narrow `-p sat-cli` build (vs. the
      # old `cargo build --all`) is targeted at the actual dependency
      # and avoids the ~5-7min cost of building every workspace bin.
      - name: Pre-build sat-cli (test fixture)
        run: cargo build -p sat-cli --locked

      - name: Run tests
        # Cap test parallelism. The default (one thread per CPU) lets the
        # regtest harness spin up 8+ satd processes simultaneously, each
        # opening RocksDB; on a 4-vCPU hosted runner that contention has
        # repeatedly tripped the per-test startup watchdog under load.
        # Four parallel workers keeps wall-clock reasonable while leaving
        # the runner enough headroom to bind RPC/P2P listeners promptly.
        #
        # SATD_TEST_TIMEOUT_MULT=2 doubles the regtest harness's startup
        # and inter-node-sync deadlines (see `test_timeout` in regtest.rs).
        # Local dev keeps the 1.0 default; CI absorbs the runner's worst-
        # case load without masking real regressions in per-RPC timeouts.
        #
        # `--all-targets` is intentionally NOT passed here. It would pull
        # in the bench targets (criterion + pprof + inferno across the
        # consensus crate) and example targets, which together more than
        # double the link surface and SIGBUS the linker on the
        # 14 GB hosted-runner SSD. Bench / example compilation is
        # validated by the Lint job's clippy run, which type-checks but
        # doesn't link.
        env:
          RUST_TEST_THREADS: "4"
          SATD_TEST_TIMEOUT_MULT: "2"
          # Disable the 80 GB free-disk pre-flight on the address-index
          # backfill RPC. The threshold is sized for mainnet (~56 GB
          # peak temp CF + headroom); regtest chains here are KB to MB
          # and a hosted runner has ~14 GB free, so the production
          # default rejects every backfill test.
          SATD_BACKFILL_PREFLIGHT_BYTES: "0"
        run: cargo test --all --locked

      # The Go SDK (clients/go) is an independent module in this repo. It is
      # tested here, on satd's own PRs, rather than in a downstream repo, so a
      # node or proto change that breaks the SDK fails the PR that made it —
      # the same reason the third-party canary fleet is PR-gating. The SDK is
      # not exercised by day-to-day node operation, so CI is the only thing
      # between a
      # green badge and a rotted client.
      - name: Set up Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: clients/go/go.mod
          cache-dependency-path: clients/go/go.sum

      # Built before the E2E suite because the differential parity test
      # (tests/e2e/parity.rs) runs INSIDE it and spawns this binary as the Go
      # half of the comparison. Handing it over by path keeps the test from
      # shelling out to `go build` on a runner mid-suite.
      - name: Build the Go parity dumper
        working-directory: clients/go
        run: go build -o "${{ runner.temp }}/paritydump" ./cmd/paritydump

      - name: Run E2E suite
        # The E2E suite (`tests/e2e.rs`) drives `satd` over real sockets
        # via real clients (sat-cli, reqwest, electrum-client). It owns
        # the boot-and-poll lifecycle per-test and is serialized so the
        # tests don't contend over a single hosted-runner's RPC/P2P
        # ports. SATD_E2E_TIMEOUT_MULT=3 gives more headroom than the
        # unit-test mult of 2 because E2E chains poll loops on top of
        # the harness's own startup wait.
        #
        # `--features e2e` is required: the `[[test]] name = "e2e"`
        # target in `satd/Cargo.toml` declares `required-features =
        # ["e2e"]`, so the binary isn't built (and the suite isn't
        # run) by the preceding `cargo test --all` step. The result:
        # the e2e suite runs exactly once, in this step, with
        # `RUST_TEST_THREADS=1` honoured.
        env:
          RUST_TEST_THREADS: "1"
          SATD_TEST_TIMEOUT_MULT: "2"
          SATD_E2E_TIMEOUT_MULT: "3"
          SATD_BACKFILL_PREFLIGHT_BYTES: "0"
          # Without this the parity test skips itself rather than failing, which
          # would quietly turn the one check that proves Go/Rust parity into a
          # no-op on the runner.
          PARITYDUMP_BIN: ${{ runner.temp }}/paritydump
        run: cargo test --test e2e --locked --features e2e

      - name: Run Go SDK unit tests
        working-directory: clients/go
        run: go test ./... -count=1

      # The examples are their own module — their curve dependency must not
      # reach an application that only imports the SDK — so the `./...` above
      # stops at their go.mod and never sees them. Compiling them here makes
      # every example a build-time check that the API still reads the way its
      # doc comment claims. Nobody runs these by hand, so without this step a
      # renamed method rots in a file whose whole job is to be copied.
      - name: Build and test the Go SDK examples
        working-directory: clients/go/examples
        run: |
          go build ./...
          go test ./... -count=1

      # The Go E2E suite drives the SAME satd binary the Rust E2E step above
      # just built, over a real gRPC socket. It is an independent module (so its
      # test-only dependencies never reach the published SDK's graph) behind the
      # `e2e` build tag, and it boots its own regtest node per test.
      #
      # Serialized like the Rust E2E suite, and for the same reason: each test
      # binds RPC/P2P/gRPC ports on one hosted runner. SATD_E2E_TIMEOUT_MULT
      # matches the Rust step's headroom — and the package -timeout must scale
      # with it: the suite runs ~2 min locally, so tripled internal timeouts
      # on a slow or cold-cache runner can push the whole package past Go's
      # default 10m cap (observed as a spurious suite-wide panic while every
      # test was passing).
      - name: Run Go SDK E2E suite
        working-directory: clients/go/e2e
        env:
          SATD_BIN: ${{ github.workspace }}/target/debug/satd
          SATD_E2E_TIMEOUT_MULT: "3"
        run: go test -tags e2e -count=1 -p 1 -timeout 30m ./...

  lint:
    name: "Lint"
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Linux build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            libclang-dev \
            libssl-dev \
            pkg-config

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93
          components: clippy
          override: true

      # Caches ~/.cargo/{registry,git,bin} AND target/, pruning the
      # fast-changing first-party crate artifacts so the expensive dependency
      # builds (rocksdb-sys + its C++ tree, bindgen, proc-macros) are restored
      # instead of recompiled every run. Keyed automatically on the rustc
      # version + Cargo.lock. Replaces the old registry-only actions/cache@v3,
      # which left target/ uncached — so every run rebuilt rocksdb from scratch
      # (~8 min of an ~9 min job). cache-on-failure keeps the warm cache even
      # when tests fail, so iterating on a red PR doesn't pay the full rebuild
      # each push. SHA-pinned (v2.9.1) for supply-chain hygiene.
      - name: Cache Rust dependencies & target dir
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          # Match the `seed-cache` job's `lint` key (see the test job). The
          # lint cache is separate from `tests` because clippy compiles a
          # different feature set (`--all-features`).
          shared-key: lint

      - name: Run clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # `--all-features` above never compiles the consensus-only build, so a
      # cfg-gated item referenced from ungated code compiles fine here and
      # breaks only for `node`'s `default-features = false` consumers — the
      # block-differential fuzz target being the one in-tree case. That is
      # exactly how `ALL_CFS` referencing the cfg-gated filter CFs went
      # unnoticed for weeks: the nightly fuzz job is the only consumer and it
      # is not a PR gate. Cheap to keep honest here.
      - name: Run clippy (node, consensus-only build)
        run: cargo clippy -p node --no-default-features --all-targets -- -D warnings

      # The published SDK's `tls` feature is default-on, and turning it off
      # changes behaviour rather than just shrinking the dependency tree: tonic
      # gates its own https handling on its `tls` feature, so a build without
      # ours connects an `https://` endpoint in cleartext. The bearer-token
      # guard is compiled differently in that build and nothing else here
      # exercises it — the doc-advertised `default-features = false` build was
      # never compiled in CI at all, and a doctest had been broken in it.
      - name: Run clippy + tests (satd-events-client, plaintext-only build)
        run: |
          cargo clippy -p satd-events-client --no-default-features --all-targets -- -D warnings
          cargo test -p satd-events-client --no-default-features

      # `fuzz/` is a separate workspace (the root `Cargo.toml` excludes it), so
      # none of the steps above compile it and no other PR job touches it. The
      # fuzz targets are hand-written against `node`'s internal API, which
      # drifts: `ConnectParams` has grown a field twice — `address_index`, then
      # `sp_index` — and each time the block-differential target stopped
      # compiling. Nothing noticed until the nightly job had been red for
      # weeks, because a build failure there produces no reproducer and so
      # files no issue.
      #
      # A type-check is enough to catch that; building the instrumented binary
      # needs a nightly toolchain and cargo-fuzz, which is what the nightly job
      # is for. Stable is fine here — `#[no_main]`/`fuzz_target!` type-check
      # without the sanitizer.
      - name: Type-check the fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets

      # --- Go SDK (clients/go) ------------------------------------------------
      #
      # gofmt + vet are the floor. staticcheck adds the classes that actually
      # bite a gRPC client: SA1019 (grpc-go deprecates aggressively — a version
      # bump must not silently strand us on a dead API), SA2002 (t.Fatal from a
      # non-test goroutine, which would make the goroutine-heavy E2E harness
      # vacuously green), and U1000 (dead unexported code in a library). errcheck
      # covers what staticcheck does not — unchecked errors, which in a client
      # library become a consumer's silent data loss. Both are pinned in the
      # clients/go/tools module.
      - name: Set up Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: clients/go/go.mod
          cache-dependency-path: clients/go/go.sum

      - name: Lint the Go SDK (gofmt, vet, staticcheck, errcheck)
        run: ./clients/go/lint.sh

      # The committed bindings must match the proto they are generated from. A
      # proto change that lands without regenerating fails right here, on the PR
      # that made it, instead of at some later release.
      - name: Check generated protobuf bindings are current
        run: |
          set -euo pipefail
          ./clients/go/gen.sh
          git diff --exit-code -- clients/go/eventspb

      # A workflow whose only triggers are `schedule` and `workflow_dispatch` is
      # never instantiated by a pull request, so nothing on a PR validates it.
      # An invalid expression there — `${{ cancelled() }}` in an `env:`, which
      # the status functions do not permit — is therefore invisible until it
      # reaches master, where GitHub rejects the file and refuses to start the
      # workflow at all. That is silent by construction: a workflow that cannot
      # start emits no failing job, and the nightly fuzz job simply stops
      # running.
      #
      # actionlint parses every file under .github/workflows and checks context
      # availability, so it catches that class before merge. shellcheck and
      # pyflakes are disabled deliberately: this gate is for "does GitHub accept
      # this file", not for style in embedded scripts, and leaving them on makes
      # the gate depend on what happens to be installed on the runner.
      - name: Lint the workflow files
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /tmp actionlint
          # `actions-rs/*` is archived and flagged repo-wide; that is a known
          # migration (tracked separately), not something to block PRs on today.
          /tmp/actionlint -shellcheck= -pyflakes= -ignore 'the runner of "actions-rs/.+" action is too old'
        env:
          ACTIONLINT_VERSION: '1.7.7'

  # Seed the dependency cache from master so a fresh branch's FIRST CI run is
  # warm instead of paying the full ~8 min rocksdb-and-deps rebuild. The
  # Tests/Lint jobs run only on pull_request, so nothing otherwise populates a
  # master (default-branch) cache for new branches to fall back to. This job
  # runs only on push to master and compiles the SAME surfaces the Tests and
  # Lint jobs compile — so their dependency artifacts land in cache — WITHOUT
  # running the suite (no slow/flaky regtest + e2e execution on master). Each
  # matrix leg uses the same `shared-key` as its consumer job (`tests` / `lint`)
  # so the caches match by key.
  seed-cache:
    name: "Seed build cache (${{ matrix.leg }})"
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        leg: [tests, lint]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/PyPy
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install Linux build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            libclang-dev \
            libssl-dev \
            pkg-config

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93
          components: clippy
          override: true

      # rust-cache's default save-if persists only on success, so a failed
      # compile never poisons the seed cache (hence no cache-on-failure here).
      - name: Cache Rust dependencies & target dir
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.leg }}

      # Compile (don't run) exactly what the Tests job builds: the workspace
      # test binaries, the sat-cli path fixture, and the e2e target. `--no-run`
      # links the test binaries but executes nothing.
      - name: Warm the tests cache
        if: matrix.leg == 'tests'
        run: |
          set -euo pipefail
          cargo test --all --no-run --locked
          cargo build -p sat-cli --locked
          cargo test --test e2e --no-run --locked --features e2e

      # Match the Lint job: clippy --all-targets --all-features. clippy
      # type-checks without linking (dodging the bench/example link that
      # SIGBUSes a plain --all-targets build on the 14 GB runner), and the
      # dependency .rlibs it builds are shared with the PR Lint run. Warnings
      # are allowed here (no `-D warnings`): the goal is to populate deps, not
      # to gate lints — that gate lives in the Lint job.
      - name: Warm the lint cache
        if: matrix.leg == 'lint'
        run: cargo clippy --all-targets --all-features --locked
