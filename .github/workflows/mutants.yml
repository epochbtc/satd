# Mutation testing (cargo-mutants). A mutant is a small deliberate break in the
# code; a mutant every test still passes is "missed", which points at behaviour
# no test checks. Line coverage says a test ran the code; this says whether a
# test would notice the code being wrong.
#
# Nightly only, and advisory: it should never be a required check, and it does
# not run on pull requests (a run takes hours). A missed mutant is a finding
# for a person to judge (some mutants are equivalent to the original and
# cannot be caught), not a failure; the job is red only when the run itself
# breaks. Each night tests one shard of the consensus-critical code
# (consensus/, node's validation, chain and mempool modules), rotating so every
# shard comes round. The shard and scope are in scripts/mutants/run.sh. Missed
# mutants are listed in the summary of the `report` job and as warning
# annotations.
#
# The shard is split into parts that run as parallel jobs of about an hour and
# a quarter each. A hosted runner is sometimes lost mid-job, and a lost runner
# uploads nothing: as one job of nearly five hours, one loss cost the whole
# night, and that shard did not come round again for weeks. Now it costs one
# part, and a scheduled run re-runs its failed parts once, by dispatching this
# workflow for the same shard. `plan` picks the shard once per run, so the
# retry tests the same mutants even on a later day.
#
# To check your own change the same way, run `scripts/mutants/run.sh diff`
# locally (see CONTRIBUTING.md).
#
# cargo-mutants runs the tests of the mutated crate only. A `node` mutant that
# only satd's regtest suite would catch is reported as missed; check that suite
# before writing a new test.

name: Mutation testing

on:
  workflow_dispatch:
    inputs:
      shard:
        description: "Nightly shard to run, as k/n, 0-based: 0/41 to 40/41 (default: tonight's)"
        required: false
        default: ""
      parts:
        description: "Parts of the shard to run, comma-separated, 0-based: 0 to 3 (default: all)"
        required: false
        default: ""
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: read

# Queued, not cancelled: the retry a scheduled run dispatches joins this group
# while that run is still finishing, and must wait for it rather than cancel it.
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: false

# Not named CARGO_* or RUST*: rust-cache folds those into its key, and the
# restores below must match the key the test jobs use. The test settings are
# on the steps that run the tests, as in ci.yml.
env:
  MUTANTS_VERSION: '27.1.0'
  # How many parallel jobs a shard is split into. The `parts` input's
  # description names the range.
  PARTS: '4'

jobs:
  plan:
    name: pick the shard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      shard: ${{ steps.plan.outputs.shard }}
      parts: ${{ steps.plan.outputs.parts }}
      count: ${{ env.PARTS }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93
          override: true

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2.87.20
        with:
          tool: cargo-mutants@${{ env.MUTANTS_VERSION }}

      - name: Pick the shard and parts
        id: plan
        env:
          SHARD: ${{ github.event.inputs.shard }}
          WANT: ${{ github.event.inputs.parts }}
        run: |
          set -euo pipefail
          shard="${SHARD:-$(bash scripts/mutants/run.sh shard)}"
          if ! [[ "$shard" =~ ^[0-9]+/[0-9]+$ ]] || [ "${shard%/*}" -ge "${shard#*/}" ]; then
            echo "::error::shard '$shard' must be k/n with 0 <= k < n"
            exit 1
          fi
          if [ -z "$WANT" ]; then
            parts=$(seq 0 $(( PARTS - 1 )) | paste -sd, -)
          else
            parts="${WANT// /}"
            for j in ${parts//,/ }; do
              if ! [[ "$j" =~ ^[0-9]+$ ]] || [ "$j" -ge "$PARTS" ]; then
                echo "::error::part '$j' must be 0 to $(( PARTS - 1 ))"
                exit 1
              fi
            done
          fi
          echo "Shard $shard, parts $parts of $PARTS."
          echo "shard=$shard" >> "$GITHUB_OUTPUT"
          echo "parts=[$parts]" >> "$GITHUB_OUTPUT"

  mutate:
    name: mutants (part ${{ matrix.part }} of ${{ needs.plan.outputs.count }})
    needs: plan
    runs-on: ubuntu-24.04
    # About 75 minutes of mutants (a shard of 150 took 290 minutes on one
    # runner), the budget below with room to spare, and setup.
    timeout-minutes: 160
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install Linux build deps
        uses: ./.github/actions/build-deps

      # The same toolchain step as ci.yml's test jobs, not dtolnay/rust-toolchain:
      # that one exports CARGO_* variables, which rust-cache hashes into its key,
      # so the `tests` cache restore below would miss.
      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93
          components: clippy
          override: true

      - name: Cache Rust dependencies & target dir
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tests
          save-if: false

      # A prebuilt binary, as deny.yml installs cargo-deny: building
      # cargo-mutants from source would take minutes of the budget every run.
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2.87.20
        with:
          tool: cargo-mutants@${{ env.MUTANTS_VERSION }}

      - name: Pre-build sat-cli (test fixture)
        run: cargo build -p sat-cli --locked

      # 120 of the job's 160 minutes; the rest is setup, build and report.
      - name: Mutate this part of the shard
        id: mutate
        env:
          MUTANTS_SKIP_REPORT: "1"
          BUDGET_MINUTES: "120"
          RUST_TEST_THREADS: "4"
          SATD_TEST_TIMEOUT_MULT: "2"
          SATD_BACKFILL_PREFLIGHT_BYTES: "0"
          SHARD: ${{ needs.plan.outputs.shard }}
          PART: ${{ matrix.part }}/${{ needs.plan.outputs.count }}
        run: bash scripts/mutants/run.sh nightly "$SHARD" "$PART"

      # This part's own summary; the annotations come from `report`, once.
      - name: Report
        if: always() && steps.mutate.outcome != 'skipped'
        env:
          MUTANTS_ANNOTATE: "0"
        run: bash scripts/mutants/run.sh report

      # The scope file as well as mutants.out: `report` reads both.
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-part-${{ matrix.part }}
          path: target/mutants-run/
          if-no-files-found: ignore
          retention-days: 30

  report:
    name: report the shard
    needs: [plan, mutate]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/mutants

      - name: Download the parts' results
        uses: actions/download-artifact@v8
        with:
          pattern: mutants-part-*
          path: parts

      # A part with no artifact (its runner lost) is named in the report.
      - name: Report
        env:
          PARTS_RUN: ${{ needs.plan.outputs.parts }}
        run: |
          set -euo pipefail
          dirs=()
          for j in $(echo "$PARTS_RUN" | tr -d '[]' | tr , ' '); do
            dirs+=("$GITHUB_WORKSPACE/parts/mutants-part-$j")
          done
          bash scripts/mutants/run.sh merge "${dirs[@]}"

  # A scheduled run whose parts failed (usually a lost runner) runs them again
  # once, for the same shard. The retry is a dispatched run, so it is never
  # retried itself.
  retry:
    name: retry failed parts
    needs: [plan, mutate]
    if: >-
      always()
      && github.event_name == 'schedule'
      && needs.plan.result == 'success'
      && needs.mutate.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch a run of the failed parts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHARD: ${{ needs.plan.outputs.shard }}
        run: |
          set -euo pipefail
          failed=$(gh run view "$RUN_ID" --json jobs --jq \
            '[.jobs[] | select(.conclusion == "failure") | .name
              | capture("^mutants \\(part (?<j>[0-9]+) of") | .j] | join(",")')
          if [ -z "$failed" ]; then
            echo "No failed part found in run $RUN_ID; nothing to retry."
            exit 0
          fi
          echo "Retrying shard $SHARD, parts $failed."
          gh workflow run mutants.yml --ref "$GITHUB_REF_NAME" \
            -f shard="$SHARD" -f parts="$failed"
          {
            echo "### Retry"
            echo
            echo "Parts $failed of shard $SHARD failed; dispatched a run of them."
          } >> "$GITHUB_STEP_SUMMARY"
