# Appliance CI — the reference stack and the downloadable VM image.
#
# Four things are gated here, in increasing cost. Only the first two run on an
# ordinary pull request:
#
#   1. The static checks: the certificate script, the container healthcheck
#      probe, and the compose/appliance invariants. Seconds, no docker, no
#      network. Runs on any PR that touches them.
#   2. The app-store packages: the StartOS package's type check, unit tests
#      and ncc bundle. Under a minute, needs only Node 22. Runs on any PR
#      that touches contrib/packaging/startos — or satd-init, which its
#      tests read.
#   3. The reference stack (contrib/stack): brought up on regtest, with every
#      TLS listener probed from outside the container against the CA the
#      stack generated, plus LND syncing to the node over Neutrino and RTL
#      served through the proxy. This is where a claim like "Sparrow can talk
#      to this" is actually checked. ~20 minutes.
#   4. The appliance image: built with mmdebstrap, booted under QEMU, and
#      inspected through the guest agent. This is the "the image is not
#      broken" gate, and it boots the artifact itself rather than a
#      test-only variant. ~20 minutes.
#
# 3 and 4 each compile satd from scratch, so together they cost around forty
# minutes of runner time. They run on `v*` tags — the same trigger the release
# workflow uses — and on workflow_dispatch, not on every pull request.
#
# To run them on a PR that actually changes this surface, add the
# `appliance-ci` label. `labeled` is in the trigger list below, so applying it
# starts the run; no push is needed.
#
# Everything runs on GitHub-hosted runners. satd is public, and a
# `pull_request` job on a self-hosted runner would let a fork PR execute
# arbitrary code on a maintainer machine.
#
# On a tag the same build runs for every published format and uploads the
# artifacts; signing stays a manual post-tag step, as it is for tarballs.

name: Appliance

on:
  pull_request:
    # `labeled` so that adding `appliance-ci` to an open PR starts the heavy
    # jobs without needing a fresh push.
    types: [opened, synchronize, reopened, labeled]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      flavor:
        description: "Which image flavour to build"
        required: false
        default: "core"
        type: choice
        options: ["core", "desktop", "both"]
      satd_version:
        description: >-
          Build the image around this published release (e.g. 0.5.2) instead
          of compiling the checkout. The tarball is verified against the
          minisign key pinned in provision/10-satd.sh. Required to publish.
        required: false
        type: string
      publish:
        description: >-
          Attach the built images to that release as assets. Needs
          satd_version, and the release must already exist and be signed.
        required: false
        default: false
        type: boolean

concurrency:
  group: appliance-${{ github.ref }}
  # A publishing run writes to a public release. Cancelling one partway
  # through `gh release upload` would leave a partial set of assets attached,
  # so those runs are not superseded; everything else still is.
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish) }}

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.93.0'

jobs:
  # Job-level path gating rather than a workflow-level `paths` filter: a
  # path-skipped workflow never reports its contexts, which leaves a PR
  # waiting on a status that will never arrive. A skipped *job* reports
  # "skipped", which satisfies branch protection.
  changes:
    name: detect appliance changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      stack: ${{ steps.filter.outputs.stack }}
      appliance: ${{ steps.filter.outputs.appliance }}
      scripts: ${{ steps.filter.outputs.scripts }}
      packages: ${{ steps.filter.outputs.packages }}
      flavors: ${{ steps.flavors.outputs.list }}
      arches: ${{ steps.flavors.outputs.arches }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Which flavours the image job builds. This is computed here rather
      # than inlined into the matrix because the dispatch input has three
      # values and one of them expands to two flavours; as a nested ternary
      # in the matrix expression it was unreadable enough that the input was
      # declared and then never referenced at all.
      - id: flavors
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
              pull_request) list='["core"]' ;;
              workflow_dispatch)
                  case "${{ inputs.flavor }}" in
                      core)    list='["core"]' ;;
                      desktop) list='["desktop"]' ;;
                      *)       list='["core","desktop"]' ;;
                  esac ;;
              *) list='["core","desktop"]' ;;
          esac
          echo "flavours: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"
          # Both architectures wherever the heavy jobs run at all. Apple
          # Silicon is most of the audience for a downloadable VM, so an
          # amd64-only image set would miss the people most likely to want
          # one. A labelled PR still builds amd64 only — it is a gate on the
          # commit, not a release.
          case "${{ github.event_name }}" in
              pull_request) arches='["amd64"]' ;;
              *)            arches='["amd64","arm64"]' ;;
          esac
          echo "arches: $arches"
          echo "arches=$arches" >> "$GITHUB_OUTPUT"
      - id: filter
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "stack=true"     >> "$GITHUB_OUTPUT"
            echo "appliance=true" >> "$GITHUB_OUTPUT"
            echo "scripts=true"   >> "$GITHUB_OUTPUT"
            echo "packages=true"  >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          files="$(git diff --name-only "$base"...HEAD)"
          echo "changed files:"; echo "$files" | sed 's/^/  /'
          match() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          # This file gates itself. Every filter below carries it, because a
          # workflow that cannot be triggered by its own edits cannot test
          # them: the four dependabot action bumps that landed as #728-#731
          # each rewrote a `uses:` line in this file and each skipped every
          # job that consumes it. The two expensive jobs stay behind the
          # `appliance-ci` label regardless, so what this actually buys is
          # the two cheap ones running on a workflow edit.
          self='^\.github/workflows/appliance\.yml$'
          # The stack job also covers the runtime image, since it ships
          # mkca.sh, satd-init and the config template.
          echo "stack=$(match "^(contrib/stack/|contrib/docker/|Dockerfile$)|$self")" >> "$GITHUB_OUTPUT"
          echo "appliance=$(match "^(contrib/appliance/|contrib/stack/|contrib/systemd/)|$self")" >> "$GITHUB_OUTPUT"
          # Widened past tls/tests: compose-test.sh asserts invariants over the
          # compose files, the appliance CLI and the Umbrel package, so it has
          # to run when any of those change. It also covers the StartOS
          # package, whose backup exclusions the Umbrel package must mirror,
          # and sync-store.sh, whose test copies both packages.
          echo "scripts=$(match "^contrib/(stack/|docker/|appliance/bin/|packaging/)|$self")" >> "$GITHUB_OUTPUT"
          # satd-init as well as the package: test/networks.test.ts reads
          # contrib/stack/satd/satd-init and compares its network list and
          # P2P ports against the package's own. That guard exists because
          # the two drifting is silent — a stale port publishes the wrong
          # P2P port, a stale name fails at first start — and gating only on
          # contrib/packaging/startos/ would skip it on exactly the change
          # it is there to catch. test/backups.test.ts reads the storage code
          # for the same reason: the directory names it excludes are there.
          echo "packages=$(match "^(contrib/packaging/startos/|contrib/stack/satd/satd-init$|node/src/storage/rocksdb_store\.rs$)|$self")" >> "$GITHUB_OUTPUT"

  # Cheap and always worth running when touched: no docker, no network.
  scripts:
    name: stack + appliance scripts
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # compose-test.sh reads the commit a package's `sha-` image pin
          # names, to check that satd has the status page.
          fetch-depth: 0
      - name: mkca.sh
        run: contrib/stack/tests/mkca-test.sh
      - name: satd-healthcheck
        run: contrib/docker/tests/healthcheck-test.sh
      - name: compose + appliance invariants
        run: contrib/stack/tests/compose-test.sh
      - name: satd-init
        run: contrib/stack/tests/satd-init-test.sh
      - name: sync-store.sh
        run: contrib/packaging/tests/sync-store-test.sh
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # `-S error` keeps this a correctness gate rather than a style one;
          # the tree has its own conventions that shellcheck disagrees with.
          shellcheck -S error \
            contrib/stack/tls/mkca.sh \
            contrib/stack/satd/satd-init \
            contrib/docker/satd-healthcheck \
            contrib/appliance/build.sh \
            contrib/appliance/bin/satd-appliance \
            contrib/appliance/firstboot/satd-appliance-firstboot \
            contrib/appliance/provision/*.sh \
            contrib/stack/tests/compose-test.sh \
            contrib/stack/tests/smoke.sh \
            contrib/stack/tests/satd-init-test.sh \
            contrib/packaging/sync-store.sh \
            contrib/packaging/tests/sync-store-test.sh

  # The StartOS package is TypeScript, and until now nothing compiled or ran
  # it here: `make` needs a StartOS server to sideload to, so the packaging
  # jobs cannot run on a hosted runner, and the type check and the unit tests
  # were left running only on whichever machine last built an .s9pk. Two of
  # the three defects that install found — a `.once()` store read that made
  # the Network action a no-op, and a ready gate wired to `/readyz` — have
  # guards in test/reactivity.test.ts, and a guard nothing executes is a
  # comment. This is the job that executes them. test/networks.test.ts is
  # the other reason, and the reason this job's path gate reaches outside
  # contrib/packaging/startos: it reads satd-init directly.
  #
  # Node 22 is not optional: the tests are `.ts` files run directly under
  # `node --test`, which needs --experimental-strip-types (22.6+). On Node 20
  # the run fails with `node: bad option: --experimental-strip-types`, which
  # reads like a broken test rather than a stale toolchain.
  #
  # `npm run prettier` is deliberately not gated. It is a convenience for
  # whoever is editing, and enforcing it would reflow the whole daemon chain
  # in main.ts — a comment-dense file where the formatter's `return (...)`
  # rewrap costs readability and proves nothing.
  packages:
    name: app-store packages (typecheck + tests)
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: contrib/packaging/startos/package-lock.json
      - name: Install
        working-directory: contrib/packaging/startos
        # `ci`, not `install`: the lockfile is committed and this must fail
        # rather than quietly resolve something else.
        run: npm ci
      - name: Typecheck and test
        working-directory: contrib/packaging/startos
        run: npm run check
      - name: The bundle the .s9pk ships still builds
        working-directory: contrib/packaging/startos
        # `make` proper needs a server to sideload to; this is the part of it
        # that can run anywhere, and it is the part that catches an import
        # the type checker accepts but ncc cannot resolve.
        run: npm run build

  stack:
    name: reference stack (regtest, TLS probed)
    needs: changes
    # Release trigger, dispatch, or an explicitly labelled PR. Roughly twenty
    # minutes of runner time, most of it compiling satd, which is not worth
    # spending on every push to every branch.
    if: needs.changes.outputs.stack == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'appliance-ci'))
    runs-on: ubuntu-24.04
    # Building the runtime image compiles satd from scratch on a cold cache,
    # and two stack bring-ups follow it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the runtime image
        # The real Dockerfile, not a shortcut: the image under test has to be
        # the one that ships mkca.sh, satd-init and the config template.
        run: docker build -t satd:ci .
      - name: Core stack
        run: SATD_IMAGE=satd:ci contrib/stack/tests/smoke.sh
      - name: With the Lightning and proxy overlays
        run: |
          SATD_IMAGE=satd:ci SATD_SMOKE_PORT_BASE=21600 \
            contrib/stack/tests/smoke.sh --with lightning --with proxy
      - name: Compose files parse
        run: |
          set -euo pipefail
          # Every secret an overlay declares as ${VAR:?} has to be in the
          # environment for the whole loop, not just for the overlay that
          # prompted it: a missing one is a parse error, so the step fails
          # on the first overlay that needs one it was not given.
          export RTL_PASSWORD=ci
          export MINT_PRIVATE_KEY=ci
          export POSTGRES_PASSWORD=ci
          export ARK_POSTGRES_PASSWORD=ci
          for overlay in lightning cln btcpay ark proxy; do
            docker compose -f contrib/stack/compose.yml \
              -f "contrib/stack/compose.$overlay.yml" \
              --env-file contrib/stack/.env.example \
              config > /dev/null
            echo "ok: $overlay"
          done
          # cashu extends the Lightning overlay, so it only parses with it.
          docker compose \
            -f contrib/stack/compose.yml \
            -f contrib/stack/compose.lightning.yml \
            -f contrib/stack/compose.cashu.yml \
            --env-file contrib/stack/.env.example config > /dev/null
          echo "ok: cashu"
          # And all of them together, which is what the appliance can end up
          # running and what no single-overlay parse would catch.
          docker compose -f contrib/stack/compose.yml \
            -f contrib/stack/compose.lightning.yml \
            -f contrib/stack/compose.cashu.yml \
            -f contrib/stack/compose.btcpay.yml \
            -f contrib/stack/compose.ark.yml \
            -f contrib/stack/compose.proxy.yml \
            --env-file contrib/stack/.env.example config > /dev/null
          echo "ok: all overlays together"

  image:
    name: build and boot the appliance image
    needs: changes
    # Same gate as `stack`: tags, dispatch, or the `appliance-ci` label.
    if: needs.changes.outputs.appliance == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'appliance-ci'))
    # Each image is built on its own architecture: debootstrap and the chroot
    # the provisioning runs in are native that way, with no emulation in the
    # build at all.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    # Only the publish step writes, and only when explicitly dispatched to.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.changes.outputs.flavors) }}
        arch: ${{ fromJSON(needs.changes.outputs.arches) }}
    steps:
      # First, so a misdispatch costs seconds rather than a 40-minute build
      # that then attaches nothing and reports success.
      - name: Publishing needs a version to publish to
        if: inputs.publish && inputs.satd_version == ''
        run: |
          echo "::error::publish=true requires satd_version (e.g. 0.5.2) —" \
               "it names both the release to attach to and the signed" \
               "tarball the image is built around."
          exit 1
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - name: Install build dependencies
        # rocksdb-sys runs bindgen, which needs libclang; the native deps
        # (rocksdb, zstd, lz4) need cmake and a compiler, and reqwest's TLS
        # backend needs libssl. Every other Rust job in this repository
        # installs the same set — without it the build dies in under a
        # minute, long before anything interesting compiles.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            libclang-dev \
            libssl-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Build the binaries the image installs
        # Skipped when building around a published release: that path
        # installs the signed tarball, so compiling the checkout would cost
        # fifteen minutes to produce binaries nothing then uses.
        if: inputs.satd_version == ''
        run: cargo build --release --locked --bin satd --bin sat-cli --bin sat-tui
      - name: Build the image
        # satd_version is free-form text, so it reaches the shell through the
        # environment rather than being pasted into the script body by the
        # expression evaluator.
        env:
          SATD_RELEASE_VERSION: ${{ inputs.satd_version }}
          FLAVOR: ${{ matrix.flavor }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          args=(--flavor "$FLAVOR" --arch "$IMAGE_ARCH" --out "$GITHUB_WORKSPACE/appliance-out")
          if [[ -n "$SATD_RELEASE_VERSION" ]]; then
              # An image we publish has to carry the binary operators can
              # verify, not a rebuild of this checkout that was never signed
              # or released. 10-satd.sh checks the tarball against the
              # minisign key from SECURITY.md before unpacking it.
              args+=(--satd-source release --satd-version "$SATD_RELEASE_VERSION")
          fi
          contrib/appliance/build-in-docker.sh "${args[@]}"
          ls -lh "$GITHUB_WORKSPACE/appliance-out"
      - name: Boot it and check every surface
        run: |
          set -euo pipefail
          # /dev/kvm is present on hosted Linux runners, so this boots with
          # hardware acceleration; the test falls back to TCG where it is not.
          ls -l /dev/kvm || echo "no /dev/kvm; the boot test will use TCG"
          image="$(ls "$GITHUB_WORKSPACE"/appliance-out/*.qcow2 | head -1)"
          contrib/appliance/tests/boot-test.sh --image "$image" \
            --arch "${{ matrix.arch }}" --in-docker
      - name: Upload
        # `always()` so a failed boot check still preserves the image. Until
        # now the upload ran only after the boot test passed, so the one run
        # whose image most needed inspecting was the one that kept nothing.
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: satd-appliance-${{ matrix.flavor }}-${{ matrix.arch }}
          # The raw image is large and reconstructible from the qcow2; the
          # checksums cover everything the build produced.
          path: |
            appliance-out/*.qcow2
            appliance-out/*.ova
            appliance-out/*.SHA256SUMS
          retention-days: 14
          compression-level: 0
      - name: Attach the images to the release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          SATD_RELEASE_VERSION: ${{ inputs.satd_version }}
        run: |
          set -euo pipefail
          # GitHub caps a release asset at 2 GiB but places no limit on a
          # release's total size or on download bandwidth. The images are
          # comfortably inside that — the core qcow2 is ~612 MB and the
          # desktop qcow2 and OVA ~1.34 GiB each — and qemu-img already
          # compressed them, so they need neither object storage nor
          # splitting. Signatures are a manual post-tag step, as they are
          # for tarballs: contrib/release/sign-tarballs.sh --images.
          cd "$GITHUB_WORKSPACE/appliance-out"
          shopt -s nullglob
          assets=( *.qcow2 *.ova *.SHA256SUMS )
          [[ ${#assets[@]} -gt 0 ]] || { echo "no images to attach" >&2; exit 1; }
          printf '  %s\n' "${assets[@]}"

          # An image that has already been signed must not be replaced. These
          # builds are not bit-reproducible, so clobbering the bytes would
          # leave the published .minisig verifying nothing — and the sums file
          # would be rewritten to match the new bytes, so nothing would look
          # wrong until an operator checked a signature.
          existing="$(gh release view "v$SATD_RELEASE_VERSION" \
                        --repo "$GITHUB_REPOSITORY" --json assets \
                        --jq '.assets[].name')"
          signed=()
          for a in "${assets[@]}"; do
            grep -qxF -- "$a.minisig" <<< "$existing" && signed+=( "$a" )
          done
          if [[ ${#signed[@]} -gt 0 ]]; then
            echo "::error::already signed on v$SATD_RELEASE_VERSION:" \
                 "${signed[*]}. Replacing them would strand the published" \
                 ".minisig. Delete each asset and its .minisig first if you" \
                 "really mean to republish."
            exit 1
          fi

          gh release upload "v$SATD_RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" --clobber -- "${assets[@]}"
