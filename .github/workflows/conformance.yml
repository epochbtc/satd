name: Consensus conformance (nightly)

# Runs the conformance suites of bitcoin-consensus-spec
# (https://github.com/coreyphillips/bitcoin-consensus-spec), an executable
# specification of Bitcoin consensus pinned to Bitcoin Core v32.1, against
# satd's own consensus code through `satd-conformance-harness`. The script
# suites exercise the Rust engine (`consensus`), not libbitcoinkernel: the
# kernel is Core's own code and would only be checked against itself. The
# block corpus replays Core's functional tests through the node's
# `ChainState`, with the Rust engine verifying scripts. The interop suite
# runs a real `satd -consensus=rust` syncing over P2P from Bitcoin Core
# v32.1, and headers-live feeds mainnet's header chain from a live peer
# through the node's header acceptance.
#
# The specification is pinned to one commit. Moving the pin is a deliberate
# change: read what changed in the spec's suites before taking it. Hosted
# runners only, like every satd job.
#
# NOT a PR gate yet. The specification is new (first published 2026-11-08)
# and maintained outside this project; it runs nightly and on demand until
# it has a track record. A failure is a disagreement to settle against
# Bitcoin Core's source and the live block differential, not a verdict on
# its own: where Core and the spec differ, Core wins and the spec gets a
# report.

on:
  schedule:
    - cron: '50 3 * * *'
  workflow_dispatch:

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BCS_REPOSITORY: coreyphillips/bitcoin-consensus-spec
  BCS_REF: 30c6d3fc807236a36b890a48c2d296e1149f971f

jobs:
  vectors:
    name: "Conformance (vector suites)"
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Checkout bitcoin-consensus-spec
        uses: actions/checkout@v7
        with:
          repository: ${{ env.BCS_REPOSITORY }}
          ref: ${{ env.BCS_REF }}
          path: bcs
          persist-credentials: false

      - name: Install Linux build deps
        uses: ./.github/actions/build-deps

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93
          override: true

      # Restores the dependency cache `ci.yml`'s `seed-cache` job keeps on
      # master (the `tests` key); saves nothing, so this job never competes
      # with it for the repository's cache space.
      - name: Restore Rust dependencies & target dir
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tests
          save-if: false

      - name: Build satd-conformance-harness
        run: cargo build --locked -p conformance-harness

      - name: Build bcs-conformance
        run: cargo build --locked --release -p conformance-runner --manifest-path bcs/Cargo.toml

      # Every default suite except `corpus`, which runs in its own job
      # below. A verdict or sighash that differs from Core fails the
      # run. A matching verdict with a different script error or reject
      # reason (level 2) is printed but does not fail it: one is known,
      # the ten-byte transaction `version | 00 00 | lock_time`, which
      # rust-bitcoin refuses to decode (`tx-decode`) and Core decodes to a
      # transaction with no inputs (`bad-txns-vin-empty`); see #1242.
      - name: Run the vector suites
        working-directory: bcs
        run: |
          ./target/release/bcs-conformance \
            --impl "$GITHUB_WORKSPACE/target/debug/satd-conformance-harness" \
            --exclude corpus \
            --verbose

  corpus:
    name: "Conformance (block corpus)"
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Checkout bitcoin-consensus-spec
        uses: actions/checkout@v7
        with:
          repository: ${{ env.BCS_REPOSITORY }}
          ref: ${{ env.BCS_REF }}
          path: bcs
          persist-credentials: false

      - name: Install Linux build deps
        uses: ./.github/actions/build-deps

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93
          override: true

      # A release build: the corpus connects about 17,000 blocks, several
      # times over across its restarts, and a debug build takes far longer.
      - name: Build satd-conformance-harness
        run: cargo build --locked --release -p conformance-harness

      - name: Build bcs-conformance
        run: cargo build --locked --release -p conformance-runner --manifest-path bcs/Cargo.toml

      # Every block, header and invalidation goes through what the node does
      # with it (see `conformance-harness/src/chain.rs`); the harness adds no
      # rule of Core's that satd lacks, so a difference here is satd's. The
      # run fails on a normative tip or height that differs from Core's.
      # Known, with its issue: the script flags under
      # -testactivationheight=segwit (#1244).
      # Chain-tip (level 1) differences are printed only: blocks that fail
      # contextual checks are not remembered (#1246), and there is no
      # low-work drop (#1247) or header-only rule for unrequested
      # blocks (#1248).
      - name: Run the block corpus
        working-directory: bcs
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          ./target/release/bcs-conformance \
            --impl "$GITHUB_WORKSPACE/target/release/satd-conformance-harness" \
            --suite corpus \
            --verbose

  interop:
    name: "Conformance (interop with Bitcoin Core)"
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Checkout bitcoin-consensus-spec
        uses: actions/checkout@v7
        with:
          repository: ${{ env.BCS_REPOSITORY }}
          ref: ${{ env.BCS_REF }}
          path: bcs
          persist-credentials: false

      - name: Install Linux build deps
        uses: ./.github/actions/build-deps

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93
          override: true

      - name: Build satd and satd-conformance-harness
        run: cargo build --locked --release -p satd -p conformance-harness

      - name: Build bcs-conformance
        run: cargo build --locked --release -p conformance-runner --manifest-path bcs/Cargo.toml

      # The bitcoind of the canaries' pinned image (CORE_IMAGE in
      # scripts/canary/PINS), Bitcoin Core v32.1 like the specification.
      - name: Extract bitcoind from the pinned Bitcoin Core image
        run: |
          set -euo pipefail
          . scripts/canary/PINS
          for i in 1 2 3; do docker pull "$CORE_IMAGE" && break || sleep $((i * 2)); done
          id=$(docker create "$CORE_IMAGE")
          # Where the image installs it changes with the version.
          path=$(docker run --rm --entrypoint sh "$CORE_IMAGE" -c 'readlink -f "$(command -v bitcoind)"')
          docker cp "$id:$path" "$RUNNER_TEMP/bitcoind"
          docker rm "$id"
          "$RUNNER_TEMP/bitcoind" -version | head -1

      # For each chain the runner loads a fresh `bitcoind -regtest`, then
      # starts a real satd (`-consensus=rust`, through the harness's
      # `--interop-node` wrapper, see `conformance-harness/src/interop.rs`)
      # that syncs from it over P2P and stops at Core's tip; tip, height and
      # UTXO set hash must match Core's, and Core must log no `Misbehaving`
      # against satd. A scenario's network options become satd's flags; an
      # option satd has no flag for fails its chains.
      - name: Run the interop suite
        working-directory: bcs
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          ./target/release/bcs-conformance interop \
            --bitcoind "$RUNNER_TEMP/bitcoind" \
            --node "$GITHUB_WORKSPACE/target/release/satd-conformance-harness --interop-node --satd $GITHUB_WORKSPACE/target/release/satd --network {network} --datadir {datadir} --peer {peer} --stop-at {stop_at} --options {options}" \
            --verbose

  headers-live:
    name: "Conformance (mainnet headers from a live peer)"
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Checkout bitcoin-consensus-spec
        uses: actions/checkout@v7
        with:
          repository: ${{ env.BCS_REPOSITORY }}
          ref: ${{ env.BCS_REF }}
          path: bcs
          persist-credentials: false

      - name: Install Linux build deps
        uses: ./.github/actions/build-deps

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93
          override: true

      - name: Build satd-conformance-harness
        run: cargo build --locked --release -p conformance-harness

      - name: Build bcs-conformance
        run: cargo build --locked --release -p conformance-runner --manifest-path bcs/Cargo.toml

      # The runner downloads mainnet's whole header chain from a peer the
      # DNS seed names and passes each `headers` message to the node's
      # header acceptance (`chain_process_headers`, via p2p); every message
      # must be accepted and the best header must be the peer's last.
      - name: Run headers-live
        working-directory: bcs
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          ./target/release/bcs-conformance headers-live \
            --impl "$GITHUB_WORKSPACE/target/release/satd-conformance-harness" \
            --network main \
            --peer seed.bitcoin.sipa.be \
            --verbose
