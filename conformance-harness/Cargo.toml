[package]
name = "conformance-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Answers the bitcoin-consensus-spec conformance protocol from satd's own consensus code"

[[bin]]
name = "satd-conformance-harness"
path = "src/main.rs"

[dependencies]
bitcoin = { workspace = true }
consensus = { path = "../consensus" }
# `block-filter-index` as satd's default build has it: the interop node
# reopens the chainstate a stopped satd left, and RocksDB refuses a
# database whose column families (here the block filter's) are not all
# named on open.
node = { path = "../node", default-features = false, features = ["block-filter-index"] }
serde_json = { workspace = true }
hex = { workspace = true }
tempfile = "3"
base64 = { workspace = true }
