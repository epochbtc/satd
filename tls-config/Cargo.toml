[package]
name = "tls-config"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
thiserror = { workspace = true }
# Leaf-cert parsing for the mTLS allowlist + peer-subject logging
# path. rustls-webpki (already transitively pulled by tokio-rustls)
# exposes verification primitives but not subject-DN / SAN extraction;
# x509-parser is the standard pure-Rust crate for that.
x509-parser = "0.16"
# Client-side only (`client` feature): sat-cli / sat-tui build their reqwest
# client through this crate so the two ends of a satd TLS connection are
# configured from one place. satd itself does not enable the feature.
reqwest = { workspace = true, optional = true }
# The public roots the client trusts when no `-rpccacert` is given. The client
# builds its own rustls configuration (so that `-rpccacert` can replace the
# public roots rather than add to them), which means it supplies the root set
# itself; this is the same crate and set reqwest's `rustls-tls` bundles.
webpki-roots = { version = "1", optional = true }

[features]
default = []
client = ["dep:reqwest", "dep:webpki-roots"]

[dev-dependencies]
rcgen = { workspace = true }
tempfile = "3"
# Handshake tests in `client`: the client half is exercised against an
# acceptor built by this crate's own server half, which needs a runtime.
tokio = { workspace = true }
